server {
    listen 80;
    server_name shmooz;
    location / {
        return 301 https://127.0.0.1:8080$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name shmooz;

    ssl_certificate	/etc/nginx/ssl/shmooz.pem;
    ssl_certificate_key	/etc/nginx/ssl/shmooz.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Allow file uploads up to 5MB (matches Django limit)
    client_max_body_size 5M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        proxy_pass http://frontend:4000;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control no-cache;
    }

    location /media/ {
        alias /var/www/media/;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/xml+rss
            application/json
            image/svg+xml;

        location ~* \.(php|pl|py|jsp|asp|sh|cgi)$ {
            deny all;
        }

        try_files $uri =404;

        access_log off;

        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~ ^/sitemap-.*\.xml$ {
        proxy_pass http://backend:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/upload-image/ {
        proxy_pass http://backend:8000/api/upload-image/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        client_max_body_size 5M;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location = /sitemap.xml {
        proxy_pass http://backend:8000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /robots.txt {
        root /usr/share/nginx/html;
        try_files /robots.txt =404;
        default_type text/plain;
        access_log off;
    }
}