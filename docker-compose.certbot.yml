# Certbot service for SSL certificate management
services:
  certbot:
    image: certbot/certbot:v2.7.4
    container_name: certbot
    volumes:
      - ./Volume/certbot/conf:/etc/letsencrypt
      - ./Volume/certbot/www:/var/www/certbot
      - ./Volume/certbot/logs:/var/log/letsencrypt
    command: >
      certonly --webroot
      --webroot-path=/var/www/certbot
      --email admin@shmooz.space
      --agree-tos
      --no-eff-email
      --force-renewal
      -d shmooz.space
      -d www.shmooz.space
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: portfolio_app-network

